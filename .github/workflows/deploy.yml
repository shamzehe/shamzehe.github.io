# Builds the site with Hugo and publishes it to https://shamzehe.github.io
# on every change to the main branch (including edits made on github.com).
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0
  TZ: America/Los_Angeles

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo-bin
          tar -xzf "$file" -C hugo-bin
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: hugo build --gc --minify --printPathWarnings --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check internal links
        run: python3 scripts/check_links.py public

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
