pronouns: "she/her"

eyebrow: "Phonology · Phonetics · Language Data Science"
headline: "Linguist working where speech, multilingual data, and machine learning meet."
bio: |
  I'm a Ph.D. student in Language Science at UC Irvine, studying how speakers adapt
  words and sounds across languages, especially English loanwords in Persian. My work
  combines production and perception experiments, acoustic analysis, and computational
  models of grammar. I'm keen to bring that to speech technology and multilingual AI,
  where systems have to cope with how real bilingual speakers talk.
open_to: "Open to internships and collaborations in speech technology, multilingual NLP, and data science."
interests:
  - "Phonological & phonetic learning"
  - "Loanword phonology"
  - "Phonological typology"
  - "Sociophonetics"
  - "Computational linguistics"

