<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="ltr">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
  {{- partialCached "validate.html" . "validate" }}
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
