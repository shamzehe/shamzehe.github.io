<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>
      <span class="brand-mark" aria-hidden="true">SH</span>
      <span class="brand-name">{{ site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        {{ partial "icon.html" (dict "name" "menu") }}<span>Menu</span>
      </button>
      <ul id="nav-menu" class="nav-menu" role="list">
        {{- range site.Menus.main }}
          {{- $active := false }}
          {{- with .Page }}{{ $active = and (not $.IsHome) (eq $.Section .Section) }}{{ end }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Dark theme" title="Toggle dark theme">
      <span class="theme-icon theme-icon-moon">{{ partial "icon.html" (dict "name" "moon") }}</span>
      <span class="theme-icon theme-icon-sun">{{ partial "icon.html" (dict "name" "sun") }}</span>
    </button>
  </div>
</header>
